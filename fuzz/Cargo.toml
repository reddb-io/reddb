[package]
name = "reddb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
reddb-io-server = { path = "../crates/reddb-server" }
reddb-io-rql = { path = "../crates/reddb-rql" }
reddb-io-wire = { path = "../crates/reddb-wire" }
reddb-io-types = { path = "../crates/reddb-types" }

[[bin]]
name = "sql_parser"
path = "fuzz_targets/sql_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_parser"
path = "fuzz_targets/migration_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conn_string_parser"
path = "fuzz_targets/conn_string_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_with_params"
path = "fuzz_targets/query_with_params.rs"
test = false
doc = false
bench = false

# cargo-fuzz requires the workspace exclusion pragma so the fuzz
# crate is not folded into the parent workspace's resolver.
[workspace]

[[bin]]
name = "json_parser"
path = "fuzz_targets/json_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redwire_frame"
path = "fuzz_targets/redwire_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redwire_bulk"
path = "fuzz_targets/redwire_bulk.rs"
test = false
doc = false
bench = false

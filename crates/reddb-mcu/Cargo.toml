[package]
name = "reddb-io-mcu"
version = "1.36.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Experimental RedDB integration package for bounded embedded storage hosts."
readme = "README.md"
documentation = "https://docs.rs/reddb-io-mcu"
keywords = ["database", "embedded", "microcontroller", "esp32", "storage"]
categories = ["database-implementations", "embedded"]

[lib]
name = "reddb_mcu"

[features]
default = []
host-flash-model = []

[dependencies]
reddb-engine = { package = "reddb-io-engine", path = "../reddb-engine", version = "1.0", default-features = false }
reddb-file = { package = "reddb-io-file", path = "../reddb-file", version = "1.0", default-features = false }
reddb-types = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "flash_emulator"
required-features = ["host-flash-model"]

[lints]
workspace = true

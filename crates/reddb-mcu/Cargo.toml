[package]
name = "reddb-io-mcu"
version = "1.33.5"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "RedDB integration package for bounded embedded storage hosts."
readme = "README.md"

[lib]
name = "reddb_mcu"

[features]
default = []
host-flash-model = []

[dependencies]
reddb-engine = { package = "reddb-io-engine", path = "../reddb-engine", version = "1.0", default-features = false, features = ["mcu"] }
reddb-file = { package = "reddb-io-file", path = "../reddb-file", version = "1.0", default-features = false, features = ["mcu"] }
reddb-types = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "flash_emulator"
required-features = ["host-flash-model"]

[lints]
workspace = true

[package]
name = "reddb-io-engine"
version = "1.36.7"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared RedDB query execution and storage primitives for native and WebAssembly runtimes."

[lib]
name = "reddb_engine"

[features]
default = ["full"]
full = ["dep:reddb-crypto", "dep:rayon", "reddb-file/full"]

[dependencies]
reddb-types = { workspace = true }
reddb-rql = { workspace = true }
reddb-file = { package = "reddb-io-file", path = "../reddb-file", version = "1.0", default-features = false }
reddb-crypto = { workspace = true, optional = true }
zeroize = "1"
crc32fast = "1.4"
hex = "0.4"
parking_lot = "0.13"
regex = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.12", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[lints]
workspace = true

[[example]]
name = "browser_conformance"
crate-type = ["cdylib"]

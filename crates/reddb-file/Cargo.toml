[package]
name = "reddb-io-file"
version = "1.26.8"
edition.workspace = true
authors.workspace = true
description = "RedDB file artifact layer: single-file .rdb layout, WAL, snapshots, checkpoints, locks, and recovery."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/reddb-io-file"
keywords = ["database", "wal", "storage", "filesystem"]
categories = ["database-implementations", "filesystem"]

[lib]
name = "reddb_file"
path = "src/lib.rs"

[dependencies]
reddb-types = { workspace = true }
blake3 = "1"
crc32fast = "1.5"
hex = "0.4"
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zstd = { version = "0.14.3", default-features = false }

[dev-dependencies]
toml = "1.1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"

[lints]
workspace = true

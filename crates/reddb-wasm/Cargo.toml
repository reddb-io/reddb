[package]
name = "reddb-io-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Experimental browser bindings for RedDB's canonical RQL and embedded file authorities."

[lib]
name = "reddb_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
reddb-engine = { workspace = true }
reddb-file = { workspace = true }
reddb-rql = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.120"
js-sys = "=0.3.97"

[lints]
workspace = true

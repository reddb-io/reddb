[package]
name = "reddb-io-client-connector"
version = "1.23.2"
edition.workspace = true
authors.workspace = true
description = "Deprecated compatibility shim for the authenticated client now provided by reddb-grpc-proto."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/reddb-io-client-connector"
readme = "README.md"
keywords = ["reddb", "database", "client", "grpc"]
categories = ["database", "api-bindings"]
include = [
    "/src/**/*.rs",
    "/README.md",
    "/Cargo.toml",
]

[lib]
name = "reddb_client_connector"
path = "src/lib.rs"

[dependencies]
reddb-grpc-proto = { workspace = true }

[lints]
workspace = true

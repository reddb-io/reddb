name: CI

on:
  workflow_dispatch:
    inputs:
      full_ci:
        description: Run expensive cross-platform and release-adjacent jobs
        type: boolean
        default: false

# Cost guard: manually requested runs cancel older runs on the same ref.
# Release-grade validation lives in release.yml; automatic pull requests and
# pushes use quick-checks.yml instead of compiling the workspace here.
#
# This public repository uses standard GitHub-hosted runners for all CI lanes.
# Feature matrices, cross-platform builds, driver conformance, containers,
# fuzz smoke, and packaging remain opt-in through `workflow_dispatch` with
# full_ci=true. Stable release builds remain
# authoritative in release.yml.

      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}
jobs:
  # Lightweight selector keeps disabled platforms from allocating runners.
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["linux_x64", "macos_arm64", "windows_x64"]'
          PLATFORM_MATRICES: |
            {}
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ !inputs.preview_platforms && needs.platforms.outputs.any == 'true' }}
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
    steps:
      - name: Enable manually requested validation
        id: classify
        run: echo "run_heavy=true" >> "$GITHUB_OUTPUT"

    needs:
      - platforms
  serialization-lint:
    # Issue #180 / ADR 0010 — grep-based preflight that flags new
    # untyped serialization across the four boundaries hardened by
    # the typed guards (`HeaderEscapeGuard`, `AuditFieldEscaper`,
    # `SerializedJsonField`, `ConnStringSanitizer`/`Tainted<T>`). The
    # lint runs in seconds; it's a fast feedback loop independent of
    # cargo cache state.
    #
    # Soft-fail mode: `continue-on-error: true` keeps the job
    # advisory for one release cycle so contributors learn the new
    # rule without breaking PRs on a class of bug grep is only
    # syntactically aware of. Upgrade path:
    #   1. Wait one release cycle of green/advisory runs.
    #   2. Drain the residue tracked in
    #      `scripts/lint-untyped-serialization-whitelist.txt` to
    #      acceptable size (every entry has an issue).
    #   3. Remove `continue-on-error` to flip to hard-fail; once
    #      flipped, every new violation must either migrate to the
    #      typed guard or land on the whitelist with a tracking
    #      issue, same as clippy.
    name: Lint (no untyped serialization)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run grep-based serialization-boundary lint
        run: bash scripts/lint-no-untyped-serialization.sh crates/
      - name: Self-test against fixture (lint must catch every category)
        # `tests/lint-fixtures/violations.rs.fixture` carries one
        # violation per category. The lint is correct iff it exits
        # non-zero on the fixture and the output names every category
        # tag the script emits.
        run: |
          set +e
          out=$(bash scripts/lint-no-untyped-serialization.sh tests/lint-fixtures/violations.rs.fixture 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: lint exited 0 against the fixture (it should catch every category)"
            exit 1
          fi
          for cat in tracing+format header+format audit+format json+format tainted-unwrap header-from-str transport-codec-import; do
            if ! printf '%s' "$out" | grep -qF "[$cat]"; then
              echo "FAIL: fixture is missing a violation for category [$cat]"
              exit 1
            fi
          done
          echo "OK: every lint category was triggered by the fixture"

  version-integrity:
    # Locks every publish target (engine crate, workspace crates, Cargo.lock,
    # @reddb-io/* npm packages, drivers/python, bun, internal packages) to one
    # version, AND fails if the committed version has fallen BEHIND the latest
    # published vX.Y.Z tag — the drift that happens when a release is cut via a
    # manual release.yml dispatch instead of the Changesets "Version Packages"
    # PR. release.yml runs this same script as a hard gate at publish time; here
    # it gives the feedback on every normal PR/push. Needs full tag history
    # (fetch-depth: 0) so the drift guard can see the published tags.
    name: Version integrity
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Check version lock-step + drift guard
        run: bash scripts/check-versions.sh

  contract-matrix:
    # Issue #567 — public-surface contract matrix gate. Fails the build
    # (and, on the release workflow, blocks the release) when any cell
    # marked `supported`/`partial` lacks an existing backing test. The
    # release-blocking policy is owned by @filipeforattini (see
    # .github/CODEOWNERS for docs/conformance/ and scripts/verify-contract-matrix.mjs).
    name: Contract Matrix Gate
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Verify every supported cell has a backing test
        run: node scripts/verify-contract-matrix.mjs
      - name: Contract-matrix tooling contract test
        run: node --test scripts/contract_matrix_contract.test.mjs
      - name: Verify all official drivers account for all four deployment modes
        run: node scripts/verify-deployment-mode-matrix.mjs
      - name: Deployment-mode tooling contract test
        run: node --test scripts/deployment_mode_matrix_contract.test.mjs
      - name: Installer checksum contract test
        run: node --test scripts/install_script_contract.test.mjs
      - name: Docs-shim ⇔ required-checks ⇔ ci.yml lock-step (#1307)
        run: node --test scripts/ci-docs-shim-contract.test.mjs

  driver-wire-conformance:
    # Issue #2162 — the SDK helper contract must traverse RedWire on every PR.
    # This stays on the free correctness lane; broader cross-driver matrices
    # remain release-adjacent and opt in through full_ci.
    name: Driver Wire Conformance
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - name: Reject silent conformance skips
        run: |
          if grep -nE 'RED_SMOKE|return;' crates/reddb-client/tests/conformance.rs; then
            echo 'driver conformance must fail explicitly, never return green without running'
            exit 1
          fi
      - name: Build RedWire server
        run: cargo build --locked --bin red
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install Bun workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @reddb-io/client-bun...
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.1'
      - name: Bun receive, lifecycle and actual RedWire client regressions
        working-directory: drivers/bun
        env:
          REDDB_BINARY_PATH: ${{ github.workspace }}/target/debug/red
        run: bun run test
      - name: Bun receive benchmark parity
        working-directory: drivers/bun
        env:
          REDDB_BENCH_ROUNDS: '3'
          REDDB_BENCH_SAMPLE_MS: '5'
        run: bun run bench-receive.ts > "$RUNNER_TEMP/bun-receive.json"
      - name: Remote HTTP native Blob Cache regression
        env:
          RED_BIN: ${{ github.workspace }}/target/debug/red
        run: node scripts/test-remote-cache.mjs
      - name: Run Rust driver conformance over RedWire
        env:
          RED_BIN: ${{ github.workspace }}/target/debug/red
        run: cargo test --locked -p reddb-io-client --features redwire --test conformance redwire

  docs-matrix:
    # Issue #568 — public docs (README, docs/query/*.md, driver READMEs) are
    # checked against the contract matrix. The matrix is the source of truth;
    # scripts/gen-docs-from-matrix.mjs projects it into a marker-delimited
    # support block in every public doc, and `--check` fails the build when a
    # doc drifts from the matrix — so a doc can never promise a feature the
    # matrix does not mark supported. Run `--write` locally to regenerate.
    name: Docs Match Contract Matrix
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Check public docs match the contract matrix
        run: node scripts/gen-docs-from-matrix.mjs --check
      - name: Doc-generation tooling contract test
        run: node --test scripts/docs_matrix_contract.test.mjs

  helm-chart:
    name: Helm Chart
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Lint and render topology matrix
        run: make check-helm

  afk-validation-sidecar:
    # Issue #970 — machine-check AFK's structured validation sidecar against
    # the actual merged diff. The contract test always runs; the live diff
    # check activates when an AFK/CI caller supplies RED_AFK_VALIDATION_SIDECAR.
    name: AFK Validation Sidecar
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Sidecar tooling contract test
        run: node --test scripts/check-afk-validation-diff.test.mjs
      - name: Check supplied AFK validation sidecar against diff
        run: |
          if [ -z "${RED_AFK_VALIDATION_SIDECAR:-}" ]; then
            echo "No RED_AFK_VALIDATION_SIDECAR supplied; contract test covered the gate."
            exit 0
          fi
          node scripts/check-afk-validation-diff.mjs \
            --sidecar "$RED_AFK_VALIDATION_SIDECAR" \
            --base "${RED_AFK_VALIDATION_BASE:-origin/main}" \
            --head "${RED_AFK_VALIDATION_HEAD:-HEAD}"

  quality:
    name: Quality (fmt, check, clippy)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-rust-1.91.0
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.14.1'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'
          cache-dependency-path: drivers/go/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.x'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: curl, ffi, hash, json, openssl
      - name: Build workflow contracts
        run: node --test scripts/build_workflow_contract.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all
      - name: Native ABI embedded single-file journey
        run: |
          cargo test --locked -p reddb-io-ffi
          cargo build --locked -p reddb-io-ffi
      - name: Go embedded single-file journey
        working-directory: drivers/go
        env:
          REDDB_EMBEDDED_SMOKE: '1'
          REDDB_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libreddb_ffi.so
        run: go test -run TestEmbeddedNativeABI -v .
      - name: .NET embedded single-file journey
        env:
          REDDB_EMBEDDED_SMOKE: '1'
          REDDB_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libreddb_ffi.so
        run: dotnet test drivers/dotnet/tests/Reddb.Tests/Reddb.Tests.csproj --filter FullyQualifiedName~EmbeddedTests
      - name: Java embedded single-file journey
        working-directory: drivers/java
        env:
          REDDB_EMBEDDED_SMOKE: '1'
          REDDB_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libreddb_ffi.so
        run: ./gradlew test --tests dev.reddb.EmbeddedTest
      - name: Kotlin embedded single-file journey
        working-directory: drivers/kotlin
        env:
          REDDB_EMBEDDED_SMOKE: '1'
          REDDB_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libreddb_ffi.so
        run: ./gradlew test --tests dev.reddb.EmbeddedTest
      - name: Dart embedded single-file journey
        working-directory: drivers/dart
        env:
          REDDB_EMBEDDED_SMOKE: '1'
          REDDB_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libreddb_ffi.so
        run: |
          dart pub get
          dart test test/embedded_test.dart
      - name: PHP embedded single-file journey
        working-directory: drivers/php
        env:
          REDDB_EMBEDDED_SMOKE: '1'
          REDDB_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libreddb_ffi.so
        run: |
          composer install --no-interaction --no-progress
          php -d ffi.enable=true vendor/bin/phpunit --filter EmbeddedTest
      - name: C++ embedded single-file journey
        run: |
          ffi_library="$(find "$GITHUB_WORKSPACE/target/debug" -name 'libreddb_ffi.so' -print -quit)"
          test -n "$ffi_library"
          cmake -S drivers/cpp -B /tmp/reddb-cpp-embedded \
            -DCMAKE_BUILD_TYPE=Release \
            -DREDDB_FFI_LIBRARY="$ffi_library"
          cmake --build /tmp/reddb-cpp-embedded --target embedded_test -j2
          LD_LIBRARY_PATH="$(dirname "$ffi_library")" \
            ctest --test-dir /tmp/reddb-cpp-embedded -R '^embedded_test$' --output-on-failure
      - name: Zig connection routing contract
        working-directory: drivers/zig
        run: |
          zig build test --summary all
          zig build connect-contract --summary all
      - name: Zig embedded single-file journey
        working-directory: drivers/zig
        run: |
          ffi_library="$(find "$GITHUB_WORKSPACE/target/debug" -name 'libreddb_ffi.so' -print -quit)"
          test -n "$ffi_library"
          ffi_root=/tmp/reddb-zig-ffi
          mkdir -p "$ffi_root/include" "$ffi_root/lib"
          cp "$GITHUB_WORKSPACE/crates/reddb-ffi/include/reddb.h" "$ffi_root/include/reddb.h"
          cp "$ffi_library" "$ffi_root/lib/libreddb_ffi.so"
          LD_LIBRARY_PATH="$ffi_root/lib" \
            zig build embedded-test -Dreddb-ffi-dir="$ffi_root" --summary all
      - name: Scoped S3 credential rotation contracts
        run: |
          cargo check --locked --all --features backend-s3
          cargo test --locked -p reddb-io-server --lib --features backend-s3 storage::backend::s3::tests
          cargo test --locked -p reddb-io-server --features backend-s3 --test operational_backup_restore
          cargo test --locked -p reddb-io-server --features backend-s3 --test s3_rotating_credentials_live --no-run
          cargo test --locked -p reddb-io-server --features backend-s3 --test operational_offline_r2_live --no-run
      - run: cargo clippy --locked --all -- -D warnings
      - name: Generate command coverage matrix
        run: cargo run --locked -p reddb-io-server --bin command-coverage > command-coverage.md
      - name: Upload command coverage matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: command-coverage-matrix
          path: command-coverage.md
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  rql-conformance:
    # PRD #1098 / ADR 0053 — the `reddb-io-rql` crate owns the
    # correctness specification of execution: an sqllogictest-format
    # conformance suite whose truth comes from the public SQLite corpus.
    # This job runs that corpus end-to-end against the current in-server
    # engine (`reddb-server`'s `RedDBRuntime`). It is the behavioral net
    # every later RQL-extraction slice must keep green.
    name: RQL Conformance (sqllogictest)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    # A cold build plus all 8k+ unit tests exceeded 20 minutes while still
    # making steady progress. Per-test hangs remain bounded by nextest.
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-rust-1.91.0
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Run sqllogictest conformance corpus against the server engine
        run: cargo test --locked --test grouped_surface_contracts rql_
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  drivers-python-build:
    # Issue #664 — `drivers/python` opts out of the workspace (it's a
    # maturin cdylib, not a workspace member), so `cargo check --all`
    # in `quality` does not cover it. Build both feature combinations
    # explicitly to catch breakage like the 37-error tonic/prost drift
    # that motivated this gate.
    name: Drivers / Python (cargo check)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: drivers-python-rust-1.91.0
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: drivers/python -> target
      # `drivers/python` intentionally owns a separate lockfile because it is
      # a maturin cdylib outside the Rust workspace. Keep stale-lock failures
      # concise instead of exposing Cargo's generic multi-line error.
      # Regenerate the intentionally separate lockfile with: cd drivers/python && cargo check
      - name: Verify drivers/python/Cargo.lock is current
        working-directory: drivers/python
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null 2>&1; then
            echo "::error::drivers/python/Cargo.lock is stale; regenerate with: cd drivers/python && cargo check"
            exit 1
          fi
      - name: cargo check --no-default-features (slim grpc/wire client only)
        working-directory: drivers/python
        run: cargo check --locked --no-default-features
      - name: "cargo check (default: embedded engine)"
        working-directory: drivers/python
        run: cargo check --locked

  drivers-node:
    # The Node addon (`drivers/node`) embeds the engine in-process for
    # @reddb-io/sdk. Like `drivers/python` it is a cdylib outside the Rust
    # workspace with its own lockfile, so nothing else compiles it: build it
    # here and run the SDK's integration test against the real `.node`.
    name: Drivers / Node (addon build + e2e)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: drivers-node-rust-1.91.0
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: drivers/node -> target
      # Regenerate the intentionally separate lockfile with: cd drivers/node && cargo check
      - name: Verify drivers/node/Cargo.lock is current
        working-directory: drivers/node
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null 2>&1; then
            echo "::error::drivers/node/Cargo.lock is stale; regenerate with: cd drivers/node && cargo check"
            exit 1
          fi
      - name: Build the addon
        working-directory: drivers/node
        run: cargo build --locked
      - name: SDK integration test against the built addon
        working-directory: drivers/js
        run: |
          cp ../node/target/debug/libreddb_node.so "$RUNNER_TEMP/reddb.node"
          REDDB_NATIVE_ADDON="$RUNNER_TEMP/reddb.node" node --test test/native-engine.e2e.test.mjs

  feature-matrix:
    # PLAN.md B5 — compile every supported feature combination that
    # operators may select for release artifacts.
    name: Feature Matrix (${{ matrix.features.label }})
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features:
          - label: no-default
            args: --no-default-features
          - label: otel
            args: --no-default-features --features otel
          - label: backend-s3
            args: --no-default-features --features backend-s3
          - label: backend-turso
            args: --no-default-features --features backend-turso
          - label: backend-d1
            args: --no-default-features --features backend-d1
          - label: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-features-rust-1.91.0-${{ matrix.features.label }}
          cache-on-failure: "true"
      - name: cargo check
        run: cargo check --locked ${{ matrix.features.args }}

  client-size-budget:
    # Release and debug outputs must not compete for the integration runner's
    # disk. Keep the size gate, with its own target directory and cache.
    name: red_client size budget
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_TARGET_DIR: target/client-size
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-client-size-v1
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: . -> target/client-size
      - name: red_client size budget
        run: ./scripts/check-red-client-size.sh
      - name: Report runner storage
        if: always()
        run: |
          df -h . "$RUNNER_TEMP"
          if [ -d target ]; then du -sh target; fi

  test-shards:
    # Issue #2171 — the integration lane is split deterministically across four
    # free public runners. A separate unit lane keeps the complete crash matrices
    # from consuming shard 1's integration window. Shards 2-3 also run the
    # doctest and persistent lanes. The release-size gate runs separately.
    # Individual durations are
    # visible in the matrix; a shard above 2x the median is the signal to
    # revisit the assignment.
    name: Test Suite ${{ matrix.shard == 'unit' && 'unit' || format('shard ({0}/4)', matrix.shard) }}
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, 1, 2, 3, 4]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Hundreds of statically linked integration binaries exhausted runner disk.
      # Keep test assertions; only omit debug symbols in this correctness lane.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reserve disk for Rust test binaries
        # Hosted images include unused Android, .NET and Haskell SDKs. Their
        # preinstalled files left only 56 MiB while linking integration tests.
        # Remove them before restoring Rust caches; preserve all test coverage.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h . "$RUNNER_TEMP"
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Do not restore the old cache containing mixed release/test outputs.
          shared-key: ubuntu-tests-nodebug-v2
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            . -> target
            . -> target/persistent-tests
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: nextest
      - name: Prepare isolated temp dir
        run: |
          mkdir -p "$RUNNER_TEMP/reddb-test-suite-tmp"
          echo "TMPDIR=$RUNNER_TEMP/reddb-test-suite-tmp" >> "$GITHUB_ENV"
      - name: Report storage before tests
        run: |
          df -h . "$RUNNER_TEMP"
          if [ -d target ]; then du -sh target; fi
      - name: Build red_client (cross-binary smoke prereq)
        run: cargo build --locked --bin red_client -p reddb-io-client --no-default-features
      - name: Run non-integration test layer
        if: matrix.shard == 'unit'
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo nextest run --workspace --locked --profile ci -E 'not kind(test)'
      - name: Qualify bounded MCU flash profiles
        if: matrix.shard == 'unit'
        run: cargo nextest run --locked -p reddb-io-mcu --features host-flash-model --profile ci
      - name: Run integration-test shard
        if: matrix.shard != 'unit'
        # cargo test runs the grouped integration binaries sequentially, so the
        # per-test sleeps (replication/timing tests) sum and blew past the 20m
        # cap. nextest runs every test in a global parallel process pool (sleeps
        # overlap). The count partition assigns every integration test to one
        # and only one runner, while the `ci` profile enforces a hard per-test
        # timeout (.config/nextest.toml).
        #
        # RUST_MIN_STACK=8M: libtest spawns each #[test] fn in a new thread
        # with Rust's 2 MiB default stack.  Query-execution paths (view
        # refresh chains, StatementExecutionFrame guards) need more headroom;
        # 8 MiB matches the OS main-thread default and prevents SIGABRT on
        # overflow without changing production behaviour.
        env:
          RUST_MIN_STACK: "8388608"
        run: scripts/nextest-e2e-shard.sh "${{ matrix.shard }}" 4
      - name: Doctests (nextest does not execute doctests)
        if: matrix.shard == 2
        run: cargo test --workspace --locked --doc
      - name: Run persistent multimodel layer
        if: matrix.shard == 3
        env:
          CARGO_TARGET_DIR: target/persistent-tests
        run: >-
          cargo test --locked --test grouped_general_multimodel integration_persistent_multimodel -- --ignored
      - name: Report temp-file residue (advisory leak guard)
        # Issue #972 — report reddb-*/reddb_*/*.rdb/*.wal residue left in the
        # dedicated per-run TMPDIR after the full test suite. The TMPDIR
        # (RUNNER_TEMP/reddb-test-suite-tmp) is ephemeral, so individual test
        # leaks are harmless; the guard now cleans them wholesale and emits a
        # CI warning rather than failing the build (see the script header).
        # Per-test cleanup via tests/support/mod.rs remains the hygiene goal,
        # surfaced as a warning instead of a merge gate.
        run: bash scripts/check-temp-residue.sh
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
      - name: Report storage after tests
        if: always()
        run: |
          df -h . "$RUNNER_TEMP"
          if [ -d target ]; then du -sh target; fi
          if [ -d "$TMPDIR" ]; then du -sh "$TMPDIR"; fi

  tests:
    # Keep ADR 0059's single required context without changing branch
    # protection. `always()` ensures a failed shard reaches this aggregate
    # instead of turning it into a misleading skipped success.
    name: Test Suite
    needs:
      - gate
      - test-shards
      - client-size-budget
      - platforms
    if: ${{ !inputs.preview_platforms && ((always() && needs.gate.outputs.run_heavy == 'true') && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Test Suite shard and client-size gate
        run: |
          test "${{ needs.test-shards.result }}" = "success"
          test "${{ needs.client-size-budget.result }}" = "success"

  driver-param-conformance:
    name: Driver Param Conformance
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'
          cache-dependency-path: drivers/go/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.x'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: curl, hash, json, openssl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.14.1'
      - name: JS RedWire parameter fixtures
        working-directory: drivers/js
        run: node --test test/redwire.params.test.mjs
      - name: Rust RedWire parameter fixtures
        run: cargo test -p reddb-io-wire --test params_fixtures
      - name: Rust gRPC parameter fixtures
        run: cargo test -p reddb-io-client --features grpc --lib grpc_params_match_shared_fixtures
      - name: Python RedWire SCRAM fixtures
        working-directory: drivers/python
        run: python tests/test_scram_conformance.py
      - name: Go RedWire/gRPC parameter fixtures
        working-directory: drivers/go
        run: go test ./redwire ./grpcx
      - name: Java RedWire parameter fixtures
        working-directory: drivers/java
        run: ./gradlew test --tests dev.reddb.ValueCodecTest
      - name: Kotlin RedWire parameter fixtures
        working-directory: drivers/kotlin
        run: ./gradlew test --tests dev.reddb.ValueCodecTest
      - name: .NET RedWire parameter fixtures
        run: dotnet test drivers/dotnet/tests/Reddb.Tests/Reddb.Tests.csproj --filter FullyQualifiedName~ValueCodecTests
      - name: Dart RedWire parameter fixtures
        working-directory: drivers/dart
        run: dart test test/value_codec_test.dart
      - name: PHP RedWire parameter fixtures
        working-directory: drivers/php
        run: composer install --no-interaction --no-progress && vendor/bin/phpunit --filter ValueCodecTest
      - name: Zig RedWire parameter fixtures
        working-directory: drivers/zig
        run: zig build param-fixtures --summary all
      - name: C++ RedWire parameter fixtures configure
        run: cmake -S drivers/cpp -B /tmp/reddb-cpp-param-conformance -DCMAKE_BUILD_TYPE=Release
      - name: C++ RedWire parameter fixtures build
        run: cmake --build /tmp/reddb-cpp-param-conformance --target value_codec_test -j2
      - name: C++ RedWire parameter fixtures
        run: /tmp/reddb-cpp-param-conformance/value_codec_test

  driver-runnable-examples:
    # Issue #1657 — execute the runnable README examples for the priority
    # official SDKs (js `@reddb-io/sdk` + python) against a real embedded
    # engine on every driver change, so the docs (one example per data model
    # plus the serialization-conflict retry contract) can never drift from the
    # released API. The JS suite needs the `red` binary; the Python driver
    # statically links the engine, so `maturin develop` is self-contained.
    name: Driver Runnable Examples
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: driver-runnable-examples-rust-1.91.0
          cache-on-failure: "true"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - name: Install Bun workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @reddb-io/client-bun...
      - name: Build red (embedded engine for the JS SDK)
        run: cargo build --locked --bin red
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.1'
      - name: Bun SDK and actual RedWire client regressions
        working-directory: drivers/bun
        env:
          REDDB_BINARY_PATH: ${{ github.workspace }}/target/debug/red
        run: bun run test
      - name: CLI logical dump and restore regressions
        env:
          REDDB_BINARY_PATH: ${{ github.workspace }}/target/debug/red
        run: python3 tests/cli_dump_restore.py
      - name: Vector execution metrics and uniqueness regressions
        env:
          REDDB_BINARY_PATH: ${{ github.workspace }}/target/debug/red
        run: |
          python3 tests/cli_vector_explain.py
          python3 tests/stdio_uniqueness.py
      - name: JS SDK runnable README examples
        working-directory: drivers/js
        env:
          REDDB_BINARY_PATH: ${{ github.workspace }}/target/debug/red
        run: |
          node test/readme-examples.test.mjs
          node test/conformance.test.mjs
      - name: Python driver runnable README examples (maturin develop + pytest)
        working-directory: drivers/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip maturin pytest
          maturin develop
          python -m pytest tests/test_readme_examples.py tests/test_smoke.py -q

  publish-dry-run:
    # Catches crates.io packaging issues (missing include paths, stale
    # path-only deps, license mismatch) before they bite at release
    # time. `cargo package` with verify rebuilds the engine from the
    # tarball, so this also exercises the include manifest end-to-end.
    name: Publish Dry-Run (crates.io)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-publish-dryrun-rust-1.91.0
          cache-on-failure: "true"
      - name: cargo package (workspace manifests)
        run: cargo package --workspace --allow-dirty --no-verify
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  containers:
    name: Container Stack
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and start primary + replica
        run: docker compose -f testdata/compose/replica.yml up -d --build
      - name: Wait for HTTP health endpoints
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health/live >/dev/null && curl -fsS http://127.0.0.1:5001/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f testdata/compose/replica.yml ps
          docker compose -f testdata/compose/replica.yml logs
          exit 1
      - name: Verify gRPC listeners inside containers
        run: |
          docker compose -f testdata/compose/replica.yml exec -T primary /usr/local/bin/red health --grpc --bind 127.0.0.1:55055
          docker compose -f testdata/compose/replica.yml exec -T replica /usr/local/bin/red health --grpc --bind 127.0.0.1:55055
      - name: Verify primary and replica respond over HTTP
        run: |
          curl -fsS http://127.0.0.1:5000/health/live
          curl -fsS http://127.0.0.1:5001/health/live
      - name: Show container status
        if: always()
        run: docker compose -f testdata/compose/replica.yml ps
      - name: Dump container logs
        if: failure()
        run: docker compose -f testdata/compose/replica.yml logs
      - name: Tear down stack
        if: always()
        run: docker compose -f testdata/compose/replica.yml down -v

  chaos:
    # PLAN.md Phase 8.4 — chaos & crash hardening matrix.
    # Runs the chaos tests plus backup/restore drills shipped in
    # the consolidated grouped test binaries. Failure is a release blocker.
    name: Chaos & Drill Suite
    runs-on: ubuntu-24.04
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    timeout-minutes: 25
    needs:
      - gate
      - tests
      - platforms
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-rust-1.91.0
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: nextest
      - name: Run chaos, drill, and persistence tests
        # nextest, like the main suite: one process per test. The
        # config_tier cases read process-wide tier state (the active
        # layout slot, the seq-N journal policy) that every persistent
        # runtime open in the chaos/persistence modules rewrites, so
        # under `cargo test`'s shared process they fail whenever the
        # scheduler interleaves them — which on the 4-vCPU runner is
        # every run.
        run: cargo nextest run --locked --test grouped_chaos_drill_persistence --no-fail-fast

  chaos-floci:
    # PLAN.md Phase 8.4 — chaos suite against an S3-compatible
    # backend (Floci) so the LocalBackend coverage doesn't mask
    # backend-specific failure modes.
    name: Chaos Suite (Floci S3 backend)
    runs-on: ubuntu-24.04
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    timeout-minutes: 25
    needs:
      - gate
      - tests
      - platforms
    env:
      RED_BACKEND: s3
      RED_S3_ENDPOINT: http://localhost:55466
      RED_S3_BUCKET: reddb-ci
      RED_S3_REGION: us-east-1
      RED_S3_PATH_STYLE: "true"
      RED_S3_ACCESS_KEY: test
      RED_S3_SECRET_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-rust-1.91.0
          cache-on-failure: "true"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Start Floci
        run: |
          docker run -d --name reddb-ci-floci \
            -p 55466:4566 \
            floci/floci:latest
      - name: Wait for Floci + create bucket
        run: |
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:55466/_localstack/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs reddb-ci-floci || true
            exit 1
          fi
          bucket=false
          for _ in $(seq 1 10); do
            if docker run --rm --network host \
              -e AWS_ACCESS_KEY_ID=test \
              -e AWS_SECRET_ACCESS_KEY=test \
              -e AWS_DEFAULT_REGION=us-east-1 \
              amazon/aws-cli:latest \
              --endpoint-url http://localhost:55466 s3 mb s3://reddb-ci; then
              bucket=true
              break
            fi
            sleep 2
          done
          if [ "$bucket" != "true" ]; then
            docker logs reddb-ci-floci || true
            exit 1
          fi
      - run: cargo test --locked --test grouped_chaos_drill_persistence --no-fail-fast chaos_
      - name: Stop Floci
        if: always()
        run: docker rm -f reddb-ci-floci || true

  windows:
    # Phase 3.6 PG parity — verify RedDB compiles + passes the core unit
    # test suite on Windows. Excludes Linux-only integration tests
    # (systemd install, mmap, Unix sockets) via cfg gates in the source.
    name: Windows (build + unit tests)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.windows_x64 == 'true')) }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-rust-1.91.0
          cache-on-failure: "true"
      - name: Check
        run: cargo check --locked --all
      - name: Unit tests
        # Skip integration tests that hit Unix-only facilities (systemd,
        # mmap, /proc). --lib stays within the library crate.
        run: cargo test --locked --lib
      - name: Embedded file-format tests
        # Issues #2265 / #2266: every embedded write failed on Windows
        # because the writer locked the data file and then reopened it —
        # `LockFileEx` locks are mandatory and per-handle, while POSIX
        # `flock` is advisory. The bug was therefore invisible to the
        # Linux suite, and `--lib` above does not reach reddb-io-file's
        # integration tests where the regression coverage lives. Running
        # them here is what makes that class of fault detectable at all.
        run: cargo test --locked -p reddb-io-file

  macos:
    # Mirror of the Windows job for Darwin; keeps the cross-platform
    # story complete. Same scope — library build + unit tests.
    name: macOS (build + unit tests)
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.macos_arm64 == 'true')) }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-rust-1.91.0
          cache-on-failure: "true"
      - name: Check
        run: cargo check --locked --all
      - name: Unit tests
        run: cargo test --locked --lib

  fuzz-parsers:
    # On-demand bounded smoke window (cost policy above); the long
    # exploration window lives in parser-fuzz-nightly.yml.
    name: Fuzz Parsers
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FUZZ_PR_TIME_SECONDS: 30
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-fuzz-pr-smoke
          cache-on-failure: "true"
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --dev
      - name: Run fuzz targets (30s each)
        # Issue #90 — conn_string_parser is a pre-auth parser, panic-
        # resistance is the only invariant; conn-string sees attacker-
        # controlled bytes before any handshake completes, so we bake
        # it into the same per-PR window as the SQL fuzzer.
        #
        # -rss_limit_mb / -malloc_limit_mb make libFuzzer report an
        # allocation-DoS (a crafted input that balloons a parser buffer)
        # as an actionable crash finding instead of a silent runner
        # OOM/timeout. scripts/fuzz-local.sh mirrors these limits (plus a
        # systemd memory cgroup) for safe fuzzing on a dev box.
        run: |
          set -euo pipefail
          for target in sql_parser migration_parser conn_string_parser query_with_params; do
            cargo +nightly fuzz run --dev "$target" -- -max_total_time="${FUZZ_PR_TIME_SECONDS}" -rss_limit_mb=4096 -malloc_limit_mb=2048
          done
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 14

  package:
    name: cargo package dry-run
    needs:
      - gate
      - platforms
    if: ${{ !inputs.preview_platforms && ((needs.gate.outputs.run_heavy == 'true' && github.event_name == 'workflow_dispatch' && inputs.full_ci) && (needs.platforms.outputs.linux_x64 == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo package --workspace
        run: cargo package --workspace --allow-dirty --no-verify

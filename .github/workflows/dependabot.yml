name: Dependabot

# Runs only on Dependabot PRs.
# All other workflows skip Dependabot (gate/job-level if conditions).
#
# Checks that the dependency update compiles and passes unit tests,
# then auto-approves patch and minor bumps so Dependabot can
# auto-merge them without manual review.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Verify update compiles
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0

      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Reuse the cache CI saves on push to main; never save from a
          # Dependabot branch (cost policy — PR branches persist no caches).
          shared-key: ubuntu-rust-1.91.0
          cache-on-failure: "true"
          save-if: "false"

      - name: cargo check
        run: cargo check --locked --all

      - name: drivers/python lockfile still resolves
        # drivers/python opts out of the workspace but path-depends on
        # workspace crates; a root dependency bump can strand its separate
        # Cargo.lock (see #1914 — ed25519-dalek 3.0 broke main post-merge).
        # cargo metadata is resolution-only: fast, no compile.
        working-directory: drivers/python
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Unit tests
        run: cargo test --locked --lib

  auto-approve:
    name: Auto-approve patch/minor bumps
    needs: check
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve patch and minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: ${{ steps.meta.outputs.update-type }} bump verified by CI."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Dependabot

# Optional dependency-update validation, dispatched on the selected branch.
# Automatic PR feedback is limited to Quick checks.
#
# Checks that the dependency update compiles and passes unit tests,
# Dependency updates are reviewed and merged separately.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Verify update compiles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0

      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Reuse the cache CI saves on push to main; never save from a
          # Dependabot branch (cost policy — PR branches persist no caches).
          shared-key: ubuntu-rust-1.91.0
          cache-on-failure: "true"
          save-if: "false"

      - name: cargo check
        run: cargo check --locked --all

      - name: drivers/python lockfile still resolves
        # drivers/python opts out of the workspace but path-depends on
        # workspace crates; a root dependency bump can strand its separate
        # Cargo.lock (see #1914 — ed25519-dalek 3.0 broke main post-merge).
        # cargo metadata is resolution-only: fast, no compile.
        working-directory: drivers/python
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Unit tests
        run: cargo test --locked --lib

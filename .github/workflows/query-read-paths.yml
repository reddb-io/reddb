name: Query read-path diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@v2
      - name: Verify captured snapshot after the fix
        run: cargo test --locked -p reddb-io-server --lib autocommit_snapshot_does_not_lose_rows_after_index_publication -- --nocapture
      - name: Verify concurrent indexed reads and writes
        run: cargo test --locked --test grouped_mvcc_transactions indexed_reads_keep_row_visible_during_autocommit_updates -- --nocapture
      - name: Confirm regression fails with the previous index policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/reddb-server/src/runtime/statement_frame.rs')
          text = path.read_text()
          old = 'let requires_index_fallback = true;'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'let requires_index_fallback = as_of_floor.is_some() || tx_context.is_some();', 1))
          PY
          set +e
          cargo test --locked -p reddb-io-server --lib autocommit_snapshot_does_not_lose_rows_after_index_publication -- --nocapture > baseline.log 2>&1
          result=$?
          set -e
          tail -n 60 baseline.log
          test "$result" -ne 0
          grep -q 'current index omitted a visible historical row' baseline.log

name: Query read-path diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@v2
      - name: Verify native insert visibility
        run: cargo test --locked -p reddb-io-server --lib native_insert_keeps_indexed_reads_visible_during_publication -- --nocapture
      - name: Verify native patch visibility
        run: cargo test --locked -p reddb-io-server --lib native_patch_keeps_indexed_reads_visible_during_publication -- --nocapture
      - name: Verify native patch publication guard
        run: cargo test --locked -p reddb-io-server --lib native_patch_marks_the_storage_index_publication_window -- --nocapture
      - name: Verify native deletion publication
        run: cargo test --locked -p reddb-io-server --lib native_delete_marks_the_storage_index_publication_window -- --nocapture
      - name: Confirm the marker test fails without guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/reddb-server/src/application/ports_impls_entity.rs')
          s = path.read_text()
          marker = '        let _indexed_mutation = crate::runtime::execution_context::IndexedMutationGuard::begin();\n'
          assert s.count(marker) >= 3
          path.write_text(s.replace(marker, ''))
          PY
          set +e
          cargo test --locked -p reddb-io-server --lib native_patch_marks_the_storage_index_publication_window -- --nocapture > baseline.log 2>&1
          result=$?
          set -e
          tail -n 50 baseline.log
          test "$result" -ne 0
          grep -q 'native patch publication must be guarded' baseline.log

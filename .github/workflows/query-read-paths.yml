name: Query read-path diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-binary-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@v2
      - name: Binary text decoder tests
        run: cargo test --locked -p reddb-io-server --lib pg_binary_text_parameters_validate_utf8 -- --nocapture
      - name: End-to-end extended wire test
        run: cargo test --locked --test grouped_redwire_protocol postgres_extended_query_supports_binary_text_params_insert_and_close -- --nocapture
      - name: Verify old decoder rejects the same wire request
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:crates/reddb-server/src/wire/postgres/types.rs > crates/reddb-server/src/wire/postgres/types.rs
          set +e
          cargo test --locked --test grouped_redwire_protocol postgres_extended_query_supports_binary_text_params_insert_and_close -- --nocapture > baseline.log 2>&1
          result=$?
          set -e
          tail -n 50 baseline.log
          test "$result" -ne 0
          grep -q 'assertion' baseline.log

name: Query read-path diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selective-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@v2
      - name: Captured snapshot remains visible
        run: cargo test --locked -p reddb-io-server --lib autocommit_snapshot_does_not_lose_rows_after_index_publication -- --nocapture
      - name: Indexed memory admission remains effective
        run: cargo test --locked -p reddb-io-server --lib resident_hash_denial_reaches_select_wire_and_dml_without_changing_rows -- --nocapture
      - name: Sorted-index memory admission remains effective
        run: cargo test --locked -p reddb-io-server --lib index_intersection_read_and_dml_failures_preserve_rows_and_release_memory -- --nocapture
      - name: Concurrent indexed reads and writes
        run: cargo test --locked --test grouped_mvcc_transactions indexed_reads_keep_row_visible_during_autocommit_updates -- --nocapture
      - name: Confirm baseline reproduces the regression
        shell: bash
        run: |
          git fetch --depth=1 origin main
          for path in crates/reddb-server/src/runtime/execution_context.rs crates/reddb-server/src/runtime/impl_dml.rs crates/reddb-server/src/runtime/impl_dml_batch.rs crates/reddb-server/src/runtime/query_exec/table.rs crates/reddb-server/src/wire/query_direct.rs; do
            git show "FETCH_HEAD:$path" > "$path"
          done
          set +e
          cargo test --locked -p reddb-io-server --lib autocommit_snapshot_does_not_lose_rows_after_index_publication -- --nocapture > baseline.log 2>&1
          result=$?
          set -e
          tail -n 60 baseline.log
          test "$result" -ne 0
          grep -q 'current index omitted a visible historical row' baseline.log

name: Storage recovery and growth

on:
  pull_request:
    paths:
      - 'crates/reddb-engine/**'
      - 'crates/reddb-file/**'
      - 'crates/reddb-server/src/storage/**'
      - 'crates/reddb-server/src/runtime/transaction_state.rs'
      - 'crates/reddb-server/src/runtime/mutation_memory_tests.rs'
      - 'crates/reddb-server/src/runtime/impl_tenant_registry.rs'
      - 'crates/reddb-server/src/runtime/red_schema/**'
      - 'crates/reddb-server/tests/**'
      - 'crates/unreliable-libc/**'
      - 'scripts/test-native-kv-crash-recovery.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/storage-apocalypse.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-recovery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  recovery-and-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: storage-recovery-rust-1.91.0
          cache-on-failure: 'true'
      - name: Repeated crashes, reuse, growth and transaction regressions
        run: |
          mkdir -p target/storage-recovery
          set -o pipefail
          make test-storage-apocalypse 2>&1 | tee target/storage-recovery/native.log
      - name: Power cuts, torn writes and failed synchronization
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/storage-recovery
          set -o pipefail
          make test-dst-storage 2>&1 | tee target/storage-recovery/power-loss.log
      - name: Recovery and catalog memory regressions
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/storage-recovery
          set -o pipefail
          make test-memory-regressions 2>&1 | tee target/storage-recovery/memory.log
      - name: Build current CLI for RedWire process recovery
        if: ${{ !cancelled() }}
        run: cargo build --locked --bin red
      - name: Recover acknowledged RedWire KV writes after forced termination
        if: ${{ !cancelled() }}
        # The Rust target cache may contain retained fixtures from an older run.
        # Keep strict fresh-directory admission and put new fixtures outside it.
        run: REDDB_TEST_BINARY=target/debug/red python scripts/test-native-kv-crash-recovery.py --output "$RUNNER_TEMP/reddb-redwire-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve reproduction and space measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storage-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/storage-recovery/*.log
            ${{ runner.temp }}/reddb-redwire-recovery-${{ github.run_id }}-${{ github.run_attempt }}/

  windows-kv-recovery:
    name: Windows KV acknowledged-write recovery
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: storage-recovery-windows-rust-1.91.0
          cache-on-failure: 'true'
      - name: Kill writer after acknowledged native KV initialization
        shell: bash
        run: |
          mkdir -p target/storage-recovery
          set -o pipefail
          cargo test --locked -p reddb-io-server --test single_file_collection_model_recovery -- --test-threads=1 --nocapture 2>&1 | tee target/storage-recovery/windows-kv.log
      - name: Build current CLI for Windows RedWire process recovery
        run: cargo build --locked --bin red
      - name: Recover acknowledged RedWire KV writes after TerminateProcess
        shell: bash
        run: REDDB_TEST_BINARY=target/debug/red.exe python scripts/test-native-kv-crash-recovery.py --output "$RUNNER_TEMP/reddb-redwire-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: storage-recovery-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/storage-recovery/*.log
            ${{ runner.temp }}/reddb-redwire-recovery-${{ github.run_id }}-${{ github.run_attempt }}/

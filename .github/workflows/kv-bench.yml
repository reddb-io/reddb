name: KV Benchmark Gate

on:
  schedule:
    - cron: '11 5 * * 0'
  workflow_dispatch:

concurrency:
  group: kv-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  KV_BENCH_P99_REGRESSION_THRESHOLD: "0.20"
  KV_BENCH_WATCH_P99_TARGET_MS: "10"

jobs:
  kv-bench:
    name: KV p99 gate
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ubuntu-kv-bench-rust-1.91.0
          cache-on-failure: "true"
      - name: Build benchmark binary
        run: cargo build --profile release-fast --bin red
      - name: Start RedDB
        run: |
          rm -f /tmp/reddb-kv-bench.rdb
          target/release-fast/red server --path /tmp/reddb-kv-bench.rdb --http-bind 127.0.0.1:5000 > /tmp/reddb-kv-bench.log 2>&1 &
          echo $! > /tmp/reddb-kv-bench.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reddb-kv-bench.log
          exit 1
      - name: Run KV benchmark
        env:
          REDDB_URL: http://127.0.0.1:5000
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          KV_BENCH_OPS: "1000"
          KV_BENCH_WATCH_EVENTS: "1000"
          KV_BENCH_OUT: bench/results/kv-latest.json
        run: bench/kv/run.sh
      - name: Gate p99 regression
        run: bench/kv/check-regression.py bench/results/kv-release-baseline.json bench/results/kv-latest.json
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kv-benchmark-result
          path: |
            bench/results/kv-latest.json
            /tmp/reddb-kv-bench.log
      - name: Stop RedDB
        if: always()
        run: |
          if [ -f /tmp/reddb-kv-bench.pid ]; then
            kill "$(cat /tmp/reddb-kv-bench.pid)" 2>/dev/null || true
          fi

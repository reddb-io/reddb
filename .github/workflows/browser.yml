name: RedDB Browser Foundation

on:
  workflow_dispatch:
    inputs:
      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}
jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
      matrix_native-artifact: ${{ steps.select.outputs.matrix_native-artifact }}
      enabled_native-artifact: ${{ steps.select.outputs.enabled_native-artifact }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["linux_x64", "windows_x64"]'
          PLATFORM_MATRICES: |
            {
              "native-artifact": [
                {
                  "flag": "linux_x64",
                  "row": {
                    "os": "ubuntu-latest"
                  }
                },
                {
                  "flag": "windows_x64",
                  "row": {
                    "os": "windows-latest"
                  }
                }
              ]
            }
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  native-artifact:
    name: Native formats and query core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix_native-artifact) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: clippy
      - name: Verify native formats, locking, crash recovery and portable interoperability
        run: cargo test --locked -p reddb-io-file -p reddb-io-engine
      - name: Lint the shared query and storage core
        run: cargo clippy --locked -p reddb-io-engine --all-targets --no-deps -- -D warnings
      - name: Preserve type and concept authorities across the engine extraction
        run: |
          cargo test --locked -p reddb-io-types --test type_authority
          cargo test --locked -p reddb-io-types --lib duration::tests
      - uses: ./.github/actions/install-protoc
        if: runner.os == 'Linux'
        with:
          version: '28.3'
      - name: Verify standalone native driver dependency locks
        if: runner.os == 'Linux'
        run: |
          cargo metadata --locked --manifest-path drivers/node/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --locked --manifest-path drivers/python/Cargo.toml --format-version 1 > /dev/null
      - name: Compare portable execution with the native runtime and query regressions
        if: runner.os == 'Linux'
        run: cargo test --locked -p reddb-io-server --test portable_query_engine --test runtime_query_behavior --test dead_storage_modules --test vault_import_corruption
      - name: Verify the native adapter and shared allocation/checkpoint orchestration
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p reddb-io-server --lib storage::query::unified
          cargo test --locked -p reddb-io-server --lib storage::unified::manager
          cargo test --locked -p reddb-io-server --lib storage::unified::store::shared_state_tests
          cargo test --locked -p reddb-io-server --lib storage::unified::store::commit::tests
          cargo test --locked -p reddb-io-server --lib storage::engine::pager
          cargo test --locked -p reddb-io-server --lib storage::engine::btree
          cargo test --locked -p reddb-io-server --lib storage::engine::overflow
          cargo test --locked -p reddb-io-server --test pager_allocation_recovery --test pager_freelist_flush_recovery --test pager_flush_transaction --test paged_checkpoint_rebuild --test btree_delete_stack --test btree_mixed_width_split --test issue_704_btree_rebuild_spills_oversized
      - name: Verify shared MVCC through the native runtime, WAL and checkpoint paths
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p reddb-io-server --lib runtime::transaction_state
          cargo test --locked -p reddb-io-server --lib runtime::table_row_mvcc_resolver
          cargo test --locked -p reddb-io --test grouped_mvcc_transactions
          cargo test --locked -p reddb-io-server --test vault_transactions --test vacuum_snapshot_horizon --test checkpoint_open_transaction --test checkpoint_concurrent_transaction --test checkpoint_gc_provenance --test checkpoint_sparse_update
      - name: Verify shared catalog through native schema enforcement and recovery
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p reddb-io-server --lib physical::json_codec
          cargo test --locked -p reddb-io-server --lib storage::unified::devx::reddb::contract_cache
          cargo test --locked -p reddb-io-server --lib application::collection_contract_enforcer
          cargo test --locked -p reddb-io-server --lib application::ttl_payload
          cargo test --locked -p reddb-io --test grouped_sql_core e2e_collection_expressions
      - name: Verify shared record queries and native secret policies
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p reddb-io-server --lib geo::h3
          cargo test --locked -p reddb-io-server --lib runtime::expr_eval
          cargo test --locked -p reddb-io-server --lib runtime::join_filter
          cargo test --locked -p reddb-io-server --lib runtime::query_exec::table
          cargo test --locked -p reddb-io-server --lib storage::query::planner
          cargo test --locked -p reddb-io-server --lib runtime::evaluator_differential
          cargo test --locked -p reddb-io-server --lib runtime::query_exec::aggregate
          cargo test --locked -p reddb-io-server --lib runtime::window_phase
          cargo test --locked -p reddb-io-server --lib auth::vault::tests::portable_vault_preserves_native_auth_payload_and_passphrase_contract
          cargo test --locked -p reddb-io-server --test vault_contract
      - name: Check every workspace target, including evaluator inventory tests
        if: runner.os == 'Linux'
        run: cargo check --locked --workspace --all-targets

    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.enabled_native-artifact == 'true') }}
  browser-artifact:
    name: WASM and OPFS (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install pinned browser dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts --filter @reddb-io/browser
          # The Azure mirror can throttle these browser packages for minutes.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          pnpm --filter @reddb-io/browser exec playwright install --with-deps chromium firefox webkit
      - name: Install checksummed wasm-bindgen 0.2.120
        env:
          BINDGEN_SHA256: ceb6f0b9fea9d2868f258215a1d7f86a4c28330a0d64432cc7d53674618772d6
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.120/wasm-bindgen-0.2.120-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "$BINDGEN_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/wasm-bindgen-0.2.120-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Check browser Rust bindings
        run: cargo clippy --locked -p reddb-io-wasm -p reddb-io-engine --lib --example browser_conformance --example pager_conformance --target wasm32-unknown-unknown --no-deps -- -D warnings
      - name: Build the real WASM artifact
        run: pnpm --filter @reddb-io/browser build
      - name: Verify native OPFS where available and explicit unsupported behavior
        run: pnpm --filter @reddb-io/browser test
      - name: Verify installable package, TypeScript and offline bundled consumers
        run: pnpm --filter @reddb-io/browser test:distribution
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.7'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.426'
      - name: Analyze the Dart browser entrypoint
        working-directory: drivers/dart
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib/reddb_browser.dart lib/src/browser test/browser_runtime_probe.dart
          dart analyze lib/reddb_browser.dart lib/src/browser test/browser_runtime_probe.dart
      - name: Compile real Dart and Blazor consumers
        run: pnpm --filter @reddb-io/browser build:interop
      - name: Verify Dart and Blazor online and after an offline browser restart
        run: pnpm --filter @reddb-io/browser test:interop
    if: ${{ !inputs.preview_platforms }}

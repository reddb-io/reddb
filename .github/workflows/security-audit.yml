# Dependency CVE scan (RustSec advisory database).
#
# SECURITY.md points auditors at `cargo audit` and states it runs in CI; this
# workflow is what makes that claim true. Accepted advisories, with the reason
# each was accepted and what would make us revisit it, live in `audit.toml` —
# so a *new* advisory fails the build while a reviewed one does not.
#
# Runs on pull requests that touch dependencies, and daily, because an
# advisory can land against a lockfile that has not changed.

name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "audit.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "audit.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Daily, so an advisory published against an unchanged lockfile is caught.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0

      - name: Install cargo-audit
        # 0.22+ is required: advisories now carry CVSS 4.0 vectors (e.g.
        # RUSTSEC-2026-0180), and 0.21 fails to parse the advisory database
        # outright — a hard error that has nothing to do with our
        # dependencies. Pinned rather than floating so a database change
        # cannot silently break the gate again.
        run: cargo install cargo-audit --locked --version ^0.22

      # The workspace lockfile plus the Python driver's standalone one, which
      # resolves its own dependency graph and has drifted behind before.
      - name: Audit workspace
        run: cargo audit --deny warnings

      - name: Audit python driver lockfile
        run: cargo audit --deny warnings --file drivers/python/Cargo.lock

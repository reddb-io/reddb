name: Columnar Read Bench Gate

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/columnar-read-bench.yml'
      - 'crates/reddb-server/benches/columnar_read_bench.rs'
      - 'crates/reddb-server/src/storage/query/batch.rs'
      - 'crates/reddb-server/src/storage/timeseries/**'
      - 'docs/engine/columnar-execution.md'
      - 'docs/perf/2026-06-03-columnar-read.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  columnar-read-bench:
    name: Columnar projection read guard
    if: github.actor != 'dependabot[bot]'
    # The guard compares a paired projection/row ratio from the same run, so it holds on
    # free GitHub-hosted hardware; pull requests never consume Blacksmith minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-columnar-read-bench-rust-1.91.0
          cache-on-failure: "true"
      - name: Run guarded Criterion lane
        run: cargo bench -p reddb-io-server --bench columnar_read_bench projection-vs-row-guard -- --sample-size 10

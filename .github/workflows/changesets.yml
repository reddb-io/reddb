name: Changesets

on:
  workflow_dispatch:

concurrency:
  group: changesets-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changesets:
    name: Version Packages
    runs-on: ubuntu-latest
    # Skip on the version-bump commit itself to avoid an infinite loop. The
    # commit landing the version bump is authored by github-actions[bot] —
    # that push doesn't need to re-trigger this workflow.
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.actor != 'github-actions[bot]')
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so `changesets/action` can rewrite tags / detect
          # changes against main.
          fetch-depth: 0
          # Tag pushes use the workflow token; the publish script dispatches
          # release.yml explicitly instead of relying on a suppressed push event.
          token: ${{ github.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify tag and publisher recovery
        run: python3 scripts/test-changesets-tag-release.py

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create release PR or tag the release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Run via pnpm so root-package `release:version` chains
          # `changeset version` + `node scripts/sync-version.js`. This is
          # what propagates the new npm version into Cargo.toml, the workspace
          # crates, drivers/python/{Cargo,pyproject}.toml, packages/internal-*,
          # and drivers/bun/package.json.
          version: pnpm release:version
          # When all changesets have been consumed (i.e. the Version Packages
          # PR has been merged) the action runs this script. We use it to push
          # the version tag and dispatch release.yml on that immutable ref.
          publish: bash scripts/changesets-tag-release.sh
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          # Do not let the action create a GitHub release; release.yml does
          # that as part of the `publish-github` job once binaries are built.
          createGithubReleases: false
        env:
          # A PAT lets release PR creation trigger normal PR checks. Publishing
          # uses workflow_dispatch, which also works with the workflow token.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}

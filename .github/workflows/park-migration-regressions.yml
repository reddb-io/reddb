name: Park migration engine regressions
on:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: park-migration-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  persisted-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e
      - uses: ./.github/actions/install-protoc
        with: {version: '28.3'}
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ubuntu-rust-1.91.0
          save-if: 'false'
      - run: cargo test --locked --test grouped_sql_core park_migration_
      - run: cargo test --locked --test docs_spatial_guide
      - run: cargo test --locked -p reddb-io-server --test native_state_recovery
      - run: cargo test --locked --test grouped_documents_kv_queues test_queue_persistent_reopen_retains_messages_and_pending_ownership
      - run: cargo build --locked --bin red
      - name: Exercise HTTP and persistent restart
        run: REDDB_TEST_BINARY=target/debug/red python3 scripts/test-park-migration-regressions.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: park-migration-qualified-red-linux
          path: target/debug/red
          retention-days: 7

name: SQL Reference

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/reference/sql-1-0-x.md'
      - 'scripts/check-sql-reference.py'
      - 'crates/reddb-server/src/storage/query/lexer.rs'
      - 'crates/reddb-server/src/storage/query/sql.rs'
      - '.github/workflows/sql-reference.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/reference/sql-1-0-x.md'
      - 'scripts/check-sql-reference.py'
      - 'crates/reddb-server/src/storage/query/lexer.rs'
      - 'crates/reddb-server/src/storage/query/sql.rs'
      - '.github/workflows/sql-reference.yml'

concurrency:
  group: sql-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check generated SQL reference blocks
        run: python3 scripts/check-sql-reference.py

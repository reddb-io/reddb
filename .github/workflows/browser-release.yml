name: Release RedDB Browser

on:
  push:
    tags: ['browser-v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: browser-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  publish:
    name: Build, verify and publish Browser package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify release identity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('packages/browser/package.json'))
          if (process.env.GITHUB_REF_NAME !== `browser-v${pkg.version}` || !/^\d+\.\d+\.\d+$/.test(pkg.version) || pkg.publishConfig.tag !== 'latest' || pkg.private) {
            throw new Error('Browser releases require a matching stable package version, latest channel and browser-v tag')
          }
          JS
      - name: Install test tools
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @reddb-io/browser
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          pnpm --filter @reddb-io/browser exec playwright install --with-deps chromium firefox
      - name: Install checksummed wasm-bindgen
        env:
          BINDGEN_SHA256: ceb6f0b9fea9d2868f258215a1d7f86a4c28330a0d64432cc7d53674618772d6
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.120/wasm-bindgen-0.2.120-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "$BINDGEN_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/wasm-bindgen-0.2.120-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build bundled JS, worker and WASM
        run: pnpm --filter @reddb-io/browser build
      - name: Verify packaged TypeScript/Vite application and offline OPFS restart
        run: pnpm --filter @reddb-io/browser test:distribution
      - name: Pack immutable release asset
        working-directory: packages/browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser-dist"
          npm pack --pack-destination "$RUNNER_TEMP/browser-dist"
          cd "$RUNNER_TEMP/browser-dist"
          sha256sum *.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/browser-dist/"* --latest=false --title "RedDB Browser ${GITHUB_REF_NAME#browser-v}" --notes-file packages/browser/RELEASE.md --verify-tag
      - name: Publish npm latest channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::NPM_TOKEN is required to publish @reddb-io/browser'
            exit 1
          fi
          npm publish "$RUNNER_TEMP/browser-dist/"*.tgz --tag latest --access public --provenance
      - name: Verify registry visibility
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/browser/package.json')).version")
          # New packages remain unavailable while npm processes the upload.
          for attempt in $(seq 1 30); do
            if npm view "@reddb-io/browser@$version" version dist.integrity dist.tarball --json --prefer-online; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::Published Browser package is still unavailable from npm'
          exit 1

name: Parser Fuzz Weekly

on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Fuzzing time per target
        type: choice
        default: '45'
        options:
          - '15'
          - '45'
          - '60'

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FUZZ_RSS_LIMIT_MB: 4096
  FUZZ_MALLOC_LIMIT_MB: 2048
  FUZZ_DURATION_SECONDS: ${{ (github.event_name == 'workflow_dispatch' && inputs.duration_minutes) || '2700' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: parser-fuzz-weekly-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - sql_parser
          - migration_parser
          - conn_string_parser
          - query_with_params
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly

      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: parser-fuzz-nightly
          cache-on-failure: "true"
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      - name: Restore evolved corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: parser-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            parser-fuzz-corpus-${{ matrix.target }}-

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Seed corpus from parser conformance
        run: python3 scripts/seed-parser-fuzz-corpus.py

      - name: Run ${{ matrix.target }}
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time="${FUZZ_DURATION_SECONDS}"
          -rss_limit_mb="${FUZZ_RSS_LIMIT_MB}"
          -malloc_limit_mb="${FUZZ_MALLOC_LIMIT_MB}"

      - name: Upload evolved corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parser-fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parser-fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Open release-blocker issue for crash
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-parser-fuzz-crashes.sh ${{ matrix.target }}

name: Blacksmith Testbox

# Permanent reddb-only pilot. Warm with `--idle-timeout 10`, run the bounded
# comparison command, then always call `blacksmith testbox stop --id <id>`.
# Select exactly one job with `blacksmith testbox warmup blacksmith-testbox.yml
# --job rust-{2,4,8}vcpu --idle-timeout 10`.
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: Testbox session ID
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-2vcpu:
    name: Rust 2 vCPU
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@22ff2ea5697369864347140857d218e42815b33c # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: testbox-rust-1.91.0-2vcpu
          cache-on-failure: 'true'
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: nextest
      - name: Run Testbox
        uses: useblacksmith/run-testbox@9b976c32aa3bcbffb348889673585a5deee1b2f3 # v2
        if: always()

  rust-4vcpu:
    name: Rust 4 vCPU
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@22ff2ea5697369864347140857d218e42815b33c # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: testbox-rust-1.91.0-4vcpu
          cache-on-failure: 'true'
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: nextest
      - name: Run Testbox
        uses: useblacksmith/run-testbox@9b976c32aa3bcbffb348889673585a5deee1b2f3 # v2
        if: always()

  rust-8vcpu:
    name: Rust 8 vCPU
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@22ff2ea5697369864347140857d218e42815b33c # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: ./.github/actions/install-protoc
        with:
          version: '28.3'
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: testbox-rust-1.91.0-8vcpu
          cache-on-failure: 'true'
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: nextest
      - name: Run Testbox
        uses: useblacksmith/run-testbox@9b976c32aa3bcbffb348889673585a5deee1b2f3 # v2
        if: always()

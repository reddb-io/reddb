name: Browser Lite Foundation

on:
  pull_request:
    paths:
      - 'crates/reddb-file/**'
      - 'crates/reddb-wasm/**'
      - 'crates/reddb-rql/**'
      - 'crates/reddb-types/**'
      - 'packages/lite/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'
      - '.github/workflows/browser-lite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  native-artifact:
    name: Native artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - name: Verify native formats, locking, crash recovery and portable interoperability
        run: cargo test --locked -p reddb-io-file

  browser-artifact:
    name: WASM and OPFS (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install pinned browser dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts --filter @reddb-io/lite
          pnpm --filter @reddb-io/lite exec playwright install --with-deps chromium firefox webkit
      - name: Install checksummed wasm-bindgen 0.2.120
        env:
          BINDGEN_SHA256: ceb6f0b9fea9d2868f258215a1d7f86a4c28330a0d64432cc7d53674618772d6
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.120/wasm-bindgen-0.2.120-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "$BINDGEN_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/wasm-bindgen-0.2.120-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Check browser Rust bindings
        run: cargo clippy --locked -p reddb-io-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build the real WASM artifact
        run: pnpm --filter @reddb-io/lite build
      - name: Verify OPFS durability, ownership, RQL validation and error paths
        run: pnpm --filter @reddb-io/lite test
